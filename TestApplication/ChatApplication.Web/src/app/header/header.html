<header class="navbar navbar-expand-lg custom-navbar">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">Dosti Adda</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">

        <!-- Show login/register if NOT logged in -->
        <ng-container *ngIf="!authService.isLoggedIn()">
          <li class="nav-item"><a class="nav-link" routerLink="/login">Login</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/register">Register</a></li>
        </ng-container>

        <!-- Show posts/chat/profile/logout if logged in -->
        <ng-container *ngIf="authService.isLoggedIn()">
          <li class="nav-item"><a class="nav-link" routerLink="/post">Posts</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/chat">Chat</a></li>

          <!-- Profile dropdown -->
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="profileDropdown"
               role="button" data-bs-toggle="dropdown" aria-expanded="false">

              <!-- Show profile picture if available, else initials -->
              <div class="profile-circle me-2">
                <ng-container *ngIf="profilePic; else initials">
                  <img [src]="profilePic" alt="Profile" class="profile-img">
                </ng-container>
                <ng-template #initials>
                  {{ getInitials() }}
                </ng-template>
              </div>

              {{ userName || 'Profile' }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
              <li><a class="dropdown-item" routerLink="/profile">Profile</a></li>
              <li><a class="dropdown-item" (click)="logout()">Logout</a></li>
            </ul>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</header>
