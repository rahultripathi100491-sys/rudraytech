name: Deploy Angular Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------
      # Setup Node
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ChatApplication.Web/package-lock.json


      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        working-directory: ChatApplication.Web
        run: npm ci


      # -----------------------------
      # Build Angular
      # -----------------------------
      - name: Build Angular Production
        working-directory: ChatApplication.Web
        run: npm run build -- --configuration production


      # -----------------------------
      # Deploy to InfinityFree
      # -----------------------------
      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITY_FTP_HOST }}
          username: ${{ secrets.INFINITY_FTP_USERNAME }}
          password: ${{ secrets.INFINITY_FTP_PASSWORD }}
          protocol: ftp
          port: 21

          local-dir: ChatApplication.Web/dist/ChatApplication.Web/browser/

          server-dir: /htdocs/
