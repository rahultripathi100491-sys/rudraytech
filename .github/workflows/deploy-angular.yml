name: Deploy Angular Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==========================================
      # 3. Install Angular dependencies
      # ==========================================
      - name: Install dependencies
        working-directory: ./TestApplication/ChatApplication.Web
        run: npm ci


      # ==========================================
      # 4. Build Angular production
      # ==========================================
      - name: Build Angular Production
        working-directory: ./TestApplication/ChatApplication.Web
        run: npm run build -- --configuration production


      # ==========================================
      # 5. Check build output
      # ==========================================
      - name: Check build output
        run: |
          echo "Angular build output:"
          ls -la ./TestApplication/ChatApplication.Web/dist
          echo ""
          echo "Browser folder:"
          ls -la ./TestApplication/ChatApplication.Web/dist/ChatApplication.Web/browser


      # ==========================================
      # 6. Deploy to InfinityFree
      # ==========================================
      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITY_FTP_HOST }}
          username: ${{ secrets.INFINITY_FTP_USERNAME }}
          password: ${{ secrets.INFINITY_FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: ./TestApplication/ChatApplication.Web/dist/ChatApplication.Web/browser/

          server-dir: /htdocs/
