name: Deploy Angular Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./TestApplication/ChatApplication.Web/package-lock.json


      # =====================================================
      # INSTALL
      # =====================================================

      - name: Install dependencies
        working-directory: ./TestApplication/ChatApplication.Web
        run: npm ci


      # =====================================================
      # BUILD
      # =====================================================

      - name: Build Angular Production
        working-directory: ./TestApplication/ChatApplication.Web
        run: npm run build -- --configuration production


      # =====================================================
      # VERIFY BUILD
      # =====================================================

      - name: Verify Angular build
        working-directory: ./TestApplication/ChatApplication.Web
        run: |

          echo "======================================"
          echo "Angular build"
          echo "======================================"

          find dist -maxdepth 4 -type f | sort

          echo ""
          echo "Checking index.html..."

          test -f dist/ChatApplication.Web/browser/index.html

          echo "Build successful."


      # =====================================================
      # CREATE .HTACCESS
      # =====================================================

      - name: Create Angular .htaccess
        working-directory: ./TestApplication/ChatApplication.Web/dist/ChatApplication.Web/browser
        run: |

          cat > .htaccess <<'EOF'
          RewriteEngine On

          RewriteBase /

          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]

          RewriteRule ^ index.html [L]
          EOF

          echo ".htaccess created."


      # =====================================================
      # DEPLOY
      # =====================================================

      - name: Deploy Angular to InfinityFree htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:

          server: ${{ secrets.INFINITY_FTP_HOST }}

          username: ${{ secrets.INFINITY_FTP_USERNAME }}

          password: ${{ secrets.INFINITY_FTP_PASSWORD }}

          protocol: ftp

          port: 21

          # Local Angular output
          local-dir: ./TestApplication/ChatApplication.Web/dist/ChatApplication.Web/browser/

          # IMPORTANT
          # No leading slash.
          server-dir: htdocs/

          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
