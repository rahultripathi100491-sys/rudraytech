name: Deploy Angular Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==============================
      # Checkout
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==============================
      # Node.js
      # ==============================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==============================
      # Install dependencies
      # ==============================
      - name: Install dependencies
        working-directory: ./TestApplication/ChatApplication.Web
        run: npm ci


      # ==============================
      # Angular production build
      # ==============================
      - name: Build Angular Production
        working-directory: ./TestApplication/ChatApplication.Web
        run: npm run build -- --configuration production


      # ==============================
      # Verify build
      # ==============================
      - name: Verify Angular build
        run: |
          echo "Checking Angular production files..."

          test -f ./TestApplication/ChatApplication.Web/dist/ChatApplication.Web/browser/index.html

          echo "Build successful!"
          echo "Files:"
          find ./TestApplication/ChatApplication.Web/dist/ChatApplication.Web/browser -maxdepth 1 -type f


      # ==============================
      # Deploy to InfinityFree
      # ==============================
      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITY_FTP_HOST }}
          username: ${{ secrets.INFINITY_FTP_USERNAME }}
          password: ${{ secrets.INFINITY_FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: ./TestApplication/ChatApplication.Web/dist/ChatApplication.Web/browser/

          server-dir: /
