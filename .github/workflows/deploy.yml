name: Build and Deploy .NET API to Somee

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: windows-latest

    env:
      # Maps your GitHub secret to .NET's ConnectionStrings:DevConnection configuration key
      ConnectionStrings__DevConnection: ${{ secrets.DB_CONNECTION_STRING }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install EF Core CLI Tool
        run: dotnet tool install --global dotnet-ef

      - name: Restore
        run: dotnet restore ./TestApplication/TestApplication.API/TestApplication.API.csproj

      - name: Build
        run: dotnet build ./TestApplication/TestApplication.API/TestApplication.API.csproj --configuration Release --no-restore

      # Runs migrations where DbContext lives in Infrastructure and configuration/dependencies live in API
      - name: Run EF Core Database Migrations
        run: |
          dotnet ef database update --project ./TestApplication/TestApplication.Infrastructure/TestApplication.Infrastructure.csproj --startup-project ./TestApplication/TestApplication.API/TestApplication.API.csproj --connection "${{ secrets.DB_CONNECTION_STRING }}"

      - name: Publish API
        run: dotnet publish ./TestApplication/TestApplication.API/TestApplication.API.csproj --configuration Release --output ./publish --no-restore

      - name: Show published files
        shell: powershell
        run: Get-ChildItem ./publish -Recurse

      - name: Deploy to Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_PATH }}
